<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Video Downloader</title>
    
    <!-- Подключение официального SDK Bastyon -->
    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app { width: 100%; max-width: 480px; padding: 20px; }
        .title { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 25px; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
        }
        input[type="text"]:focus { outline: none; border-color: #f97316; }
        .btn {
            border: 0;
            border-radius: 14px;
            padding: 0 20px;
            background: #f97316;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn:hover { background: #ea580c; }
        .result { margin-top: 20px; padding: 18px; border-radius: 18px; background: #1f2937; display: none; }
        .video-info { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
        .video-thumb { width: 110px; height: 62px; object-fit: cover; border-radius: 8px; background: #374151; }
        .video-details h3 {
            font-size: 14px; margin: 0 0 6px 0;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .video-details p { font-size: 12px; color: #9ca3af; margin: 0; }
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .action-btn {
            background: #3b82f6; color: white; text-decoration: none;
            padding: 12px 14px; border-radius: 10px; font-size: 14px;
            font-weight: 500; text-align: center; display: block; border: none; cursor: pointer;
        }
        .action-btn:hover { opacity: 0.9; }
        .download-btn { background: #10b981; }
        .download-btn:disabled { background: #047857; opacity: 0.7; cursor: not-allowed; }
        .status { margin-top: 20px; text-align: center; color: #6ee7b7; font-size: 13px; }
    </style>
</head>
<body>

<div class="app">
    <div class="title">Bastyon DL</div>
    <div class="subtitle">Скачивание видео из сети</div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Введите ID или ссылку на видео...">
        <button class="btn" onclick="fetchVideo()">Найти</button>
    </div>

    <div id="resultCard" class="result">
        <div class="video-info">
            <img id="videoThumb" class="video-thumb" src="" alt="Thumbnail">
            <div class="video-details">
                <h3 id="videoTitle">Загрузка...</h3>
                <p id="videoAuthor">Автор: —</p>
            </div>
        </div>
        <div class="actions">
            <a id="playerLink" href="#" target="_blank" class="action-btn">📥 Открыть в плеере Bastyon</a>
            <button id="downloadBtn" class="action-btn download-btn" style="display:none;" onclick="downloadVideoViaBlob()">💾 Скачать видеофайл</button>
        </div>
    </div>

    <div id="status" class="status">Инициализация SDK...</div>
</div>

<script>
let sdk = null;
let currentVideoUrl = null;
let currentVideoTitle = "bastyon-video";
let downloadAbortController = null;

// Инициализация Bastyon SDK
async function initBastyon() {
    try {
        if (typeof BastyonSdk !== 'undefined') {
            sdk = new BastyonSdk();
            await sdk.init();
            sdk.emit("loaded");
            document.getElementById("status").textContent = "Bastyon подключён";
        }
    } catch (e) {
        document.getElementById("status").textContent = "Автономный режим";
    }
}

// Извлечение ID видео из ссылки или строки
function extractVideoId(input) {
    input = input.trim();
    try {
        if (input.includes('http')) {
            const urlObj = new URL(input);
            return urlObj.searchParams.get("v") || urlObj.searchParams.get("id") || urlObj.pathname.split("/").pop();
        }
    } catch (e) {}
    return input;
}

// Запрос данных видео через RPC ноду Pocketnet
async function fetchVideo() {
    const rawInput = document.getElementById("urlInput").value;
    const videoId = extractVideoId(rawInput);
    if (!videoId) return;

    const resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";
    
    document.getElementById("videoTitle").textContent = "Загрузка метаданных...";
    document.getElementById("videoAuthor").textContent = "Автор: поиск...";
    document.getElementById("downloadBtn").style.display = "none";
    
    const playerLink = document.getElementById("playerLink");
    playerLink.href = `https://bastyon.com/index?video=1&v=${videoId}`;

    try {
        const response = await fetch('https://1.pocketnet.app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                jsonrpc: '2.0',
                id: 1,
                method: 'getpost',
                params: [videoId]
            })
        });

        if (response.ok) {
            const data = await response.json();
            const post = data.result;

            if (post) {
                currentVideoTitle = post.caption || post.title || "bastyon-video";
                const author = post.address || "Неизвестный автор";
                let thumb = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";
                
                if (post.settings && post.settings.v && post.settings.v.image) {
                    thumb = post.settings.v.image;
                } else if (post.image) {
                    thumb = post.image;
                }

                // Проверяем наличие прямой ссылки на видеофайл в посте
                if (post.settings && post.settings.v && post.settings.v.url) {
                    currentVideoUrl = post.settings.v.url;
                    document.getElementById("downloadBtn").style.display = "block";
                }

                document.getElementById("videoTitle").textContent = currentVideoTitle;
                document.getElementById("videoAuthor").textContent = "Автор: " + author;
                document.getElementById("videoThumb").src = thumb;
                return;
            }
        }
        throw new Error("Пост не найден");
    } catch (err) {
        console.warn("Ошибка запроса метаданных:", err);
        document.getElementById("videoTitle").textContent = "Видео (ID: " + videoId.substring(0, 10) + "...)";
        document.getElementById("videoAuthor").textContent = "Автор: Сеть Bastyon";
    }
}

// Функция скачивания видео через Blob с отслеживанием прогресса
async function downloadVideoViaBlob() {
    if (!currentVideoUrl) return;

    const downloadBtn = document.getElementById("downloadBtn");
    downloadAbortController = new AbortController();

    try {
        downloadBtn.textContent = "⏳ Подготовка к загрузке...";
        downloadBtn.disabled = true;

        const response = await fetch(currentVideoUrl, {
            signal: downloadAbortController.signal
        });

        if (!response.ok) throw new Error(`Ошибка загрузки: ${response.status}`);

        const contentLength = response.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength, 10) : 0;
        let loaded = 0;

        const reader = response.body.getReader();
        const chunks = [];

        // Чтение потока по частям для отображения процентов
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            loaded += value.length;

            if (total > 0) {
                const percent = Math.round((loaded / total) * 100);
                downloadBtn.textContent = `📥 Скачивание: ${percent}%`;
            } else {
                downloadBtn.textContent = `📥 Скачано: ${(loaded / (1024 * 1024)).toFixed(1)} МБ`;
            }
        }

        downloadBtn.textContent = "💾 Сохранение файла...";

        const blob = new Blob(chunks, { type: 'video/mp4' });
        const blobUrl = window.URL.createObjectURL(blob);

        // Форматируем безопасное имя файла из заголовка
        const safeName = currentVideoTitle.replace(/[^a-zA-Zа-яА-Я0-9-_]/g, '_').substring(0, 50);

        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `${safeName || 'video'}.mp4`;
        document.body.appendChild(link);
        link.click();
        
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);

        downloadBtn.textContent = "✅ Готово!";
        setTimeout(() => {
            downloadBtn.textContent = "💾 Скачать видеофайл";
            downloadBtn.disabled = false;
        }, 3000);

    } catch (err) {
        if (err.name === 'AbortError') {
            console.log("Скачивание отменено пользователем.");
        } else {
            console.warn("Blob недоступен, открываем прямую ссылку в новой вкладке:", err);
            window.open(currentVideoUrl, '_blank');
        }
        downloadBtn.textContent = "💾 Скачать видеофайл";
        downloadBtn.disabled = false;
    }
}

window.onload = initBastyon;
</script>

</body>
</html>
