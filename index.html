<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Video Downloader</title>
    
    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1f2937;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            background: #374151;
        }

        .profile-info {
            min-width: 0;
            flex: 1;
        }

        .profile-name {
            font-size: 18px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-address {
            margin-top: 4px;
            font-size: 12px;
            color: #9ca3af;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .balance {
            margin-left: auto;
            font-size: 14px;
            white-space: nowrap;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #f97316;
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 0 20px;
            background: #f97316;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #ea580c;
        }

        .result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 18px;
            background: #1f2937;
        }

        .hidden {
            display: none;
        }

        .video-info {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }

        .video-thumb {
            width: 100px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            background: #374151;
        }

        .video-details h3 {
            font-size: 15px;
            margin: 0 0 4px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-details p {
            font-size: 12px;
            color: #9ca3af;
            margin: 0;
        }

        .download-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .download-btn {
            background: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            color: #6ee7b7;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app">

    <!-- Профиль пользователя -->
    <div class="profile">
        <img id="avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
        <div class="profile-info">
            <div id="profileName" class="profile-name">Гость</div>
            <div id="profileAddress" class="profile-address">Автономный режим</div>
        </div>
        <div id="profileBalance" class="balance">0 PKOIN</div>
    </div>

    <div class="title">Bastyon DL</div>
    <div class="subtitle">Скачивание видео из децентрализованной сети</div>

    <!-- Поле ввода ссылки -->
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://bastyon.com/index?v=...">
        <button class="btn" onclick="fetchVideo()">Найти</button>
    </div>

    <!-- Блок результата -->
    <div id="resultCard" class="result hidden">
        <div class="video-info">
            <img id="videoThumb" class="video-thumb" src="" alt="Thumbnail">
            <div class="video-details">
                <h3 id="videoTitle">Загрузка информации...</h3>
                <p id="videoAuthor">Автор: ...</p>
            </div>
        </div>
        <div style="font-size: 13px; color: #9ca3af; margin-bottom: 8px;">Доступные файлы для скачивания:</div>
        <div id="linksList" class="download-options"></div>
    </div>

    <!-- Статус подключения SDK -->
    <div id="status" class="status">Инициализация...</div>

</div>

<script>
let sdk = null;

async function initBastyon() {
    try {
        if (typeof BastyonSdk !== 'undefined') {
            sdk = new BastyonSdk();
            await Promise.race([
                sdk.init(),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 3000))
            ]);
            sdk.emit("loaded");

            const account = await sdk.get.account().catch(() => null);
            if (account && account.address) {
                document.getElementById("profileAddress").textContent = account.address;
                document.getElementById("profileName").textContent = "Игрок " + account.address.substring(0, 6);
            }

            const balance = await sdk.get.balance().catch(() => null);
            if (balance) {
                const amount = Number(balance.actual ?? balance.total ?? 0);
                document.getElementById("profileBalance").textContent = amount.toFixed(4) + " PKOIN";
            }
            document.getElementById("status").textContent = "Bastyon подключён";
        }
    } catch (e) {
        document.getElementById("status").textContent = "Автономный режим";
    }
}

async function fetchVideo() {
    const rawUrl = document.getElementById("urlInput").value.trim();
    if (!rawUrl) {
        alert("Введите ссылку на видео Bastyon");
        return;
    }

    const resultCard = document.getElementById("resultCard");
    resultCard.classList.remove("hidden");

    document.getElementById("videoTitle").textContent = "Поиск данных поста...";
    document.getElementById("videoAuthor").textContent = "Автор: определяется...";
    document.getElementById("videoThumb").src = "https://i.imgur.com/6VBx3io.png";
    const linksList = document.getElementById("linksList");
    linksList.innerHTML = "Загрузка потоков...";

    let videoId = "";
    try {
        const urlObj = new URL(rawUrl);
        videoId = urlObj.searchParams.get("v") || urlObj.searchParams.get("id") || urlObj.pathname.split("/").pop();
    } catch (err) {
        videoId = rawUrl; // если ввели просто ID
    }

    let postData = null;
    
    // Пытаемся получить данные через RPC ноды Bastyon, если SDK доступен
    if (sdk && typeof sdk.rpc === "function" && videoId) {
        try {
            const res = await sdk.rpc("getpost", [videoId], { cachetime: 0 });
            if (res) postData = res;
        } catch (e) {
            console.warn("RPC getpost не удался, пробуем альтернативный метод", e);
        }
    }

    // Если данные получены из сети
    if (postData) {
        const title = postData.caption || postData.title || "Видео из Bastyon";
        const author = postData.address || postData.user || "@unknown";
        const img = postData.image || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";
        
        document.getElementById("videoTitle").textContent = title;
        document.getElementById("videoAuthor").textContent = "Автор: " + author;
        document.getElementById("videoThumb").src = img;

        linksList.innerHTML = "";
        
        // Генерация ссылки на скачивание (прямой поток или IPFS-видео)
        const videoFileUrl = postData.video || postData.file || rawUrl;
        
        const a = document.createElement("a");
        a.href = videoFileUrl;
        a.className = "download-btn";
        a.target = "_blank";
        a.innerHTML = `📥 Скачать видео (MP4)`;
        linksList.appendChild(a);

    } else {
        // Резервный режим, если RPC недоступен или ссылка прямая
        document.getElementById("videoTitle").textContent = "Видео по ссылке: " + videoId;
        document.getElementById("videoAuthor").textContent = "Автор: Bastyon Creator";
        document.getElementById("videoThumb").src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";

        linksList.innerHTML = "";
        const a = document.createElement("a");
        a.href = rawUrl;
        a.className = "download-btn";
        a.target = "_blank";
        a.innerHTML = `📥 Открыть источник / Скачать`;
        linksList.appendChild(a);
    }
}

initBastyon();
</script>

</body>
</html>
