<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Video Downloader</title>
    
    <!-- Подключение официального SDK Bastyon -->
    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app { width: 100%; max-width: 480px; padding: 20px; }
        .title { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 25px; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
        }
        input[type="text"]:focus { outline: none; border-color: #f97316; }
        .btn {
            border: 0;
            border-radius: 14px;
            padding: 0 20px;
            background: #f97316;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn:hover { background: #ea580c; }
        .result { margin-top: 20px; padding: 18px; border-radius: 18px; background: #1f2937; display: none; }
        .video-info { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
        .video-thumb { width: 110px; height: 62px; object-fit: cover; border-radius: 8px; background: #374151; }
        .video-details h3 {
            font-size: 14px; margin: 0 0 6px 0;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .video-details p { font-size: 12px; color: #9ca3af; margin: 0; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .action-btn {
            background: #3b82f6; color: white; text-decoration: none;
            padding: 12px 14px; border-radius: 10px; font-size: 14px;
            font-weight: 500; text-align: center; display: block; border: none; cursor: pointer;
        }
        .action-btn:hover { opacity: 0.9; }
        .download-btn { background: #10b981; }
        .proxy-btn { background: #8b5cf6; }
        .status { margin-top: 20px; text-align: center; color: #6ee7b7; font-size: 13px; }
    </style>
</head>
<body>

<div class="app">
    <div class="title">Bastyon DL</div>
    <div class="subtitle">Скачивание видео из сети</div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Введите ID или ссылку на видео..." value="4a1d7e9561a94b8b3f65abb42deccd9747b74288ae874f7bde0156b4725a148f">
        <button class="btn" onclick="fetchVideo()">Найти</button>
    </div>

    <div id="resultCard" class="result" style="display: block;">
        <div class="video-info">
            <img id="videoThumb" class="video-thumb" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80" alt="Thumbnail">
            <div class="video-details">
                <h3 id="videoTitle">Загрузка метаданных...</h3>
                <p id="videoAuthor">Автор: поиск...</p>
            </div>
        </div>
        <div class="actions">
            <a id="playerLink" href="#" target="_blank" class="action-btn">📥 Открыть в плеере Bastyon</a>
            
            <!-- Способ 1: Прямая ссылка с атрибутом download (обходит CORS на уровне браузера) -->
            <a id="directDownloadLink" href="#" class="action-btn download-btn" style="display:none;" download="video.mp4">
                💾 Прямое скачивание (1 клик)
            </a>

            <!-- Способ 2: Скачивание через обходчик CORS (если прямое заблокировано) -->
            <button id="proxyDownloadBtn" class="action-btn proxy-btn" style="display:none;" onclick="downloadViaProxy()">
                🔄 Скачать через CORS-шлюз
            </button>
        </div>
    </div>

    <div id="status" class="status">Инициализация SDK...</div>
</div>

<script>
let sdk = null;
let currentVideoUrl = null;
let currentVideoTitle = "bastyon-video";

// Инициализация Bastyon SDK
async function initBastyon() {
    try {
        if (typeof BastyonSdk !== 'undefined') {
            sdk = new BastyonSdk();
            await sdk.init();
            sdk.emit("loaded");
            document.getElementById("status").textContent = "Bastyon подключён";
        }
    } catch (e) {
        document.getElementById("status").textContent = "Автономный режим";
    }
    // Автоматически запускаем поиск для примера из запроса
    fetchVideo();
}

// Извлечение ID видео из ссылки или строки
function extractVideoId(input) {
    input = input.trim();
    try {
        if (input.includes('http')) {
            const urlObj = new URL(input);
            return urlObj.searchParams.get("v") || urlObj.searchParams.get("id") || urlObj.pathname.split("/").pop();
        }
    } catch (e) {}
    return input;
}

// Запрос данных видео через RPC ноду Pocketnet
async function fetchVideo() {
    const rawInput = document.getElementById("urlInput").value;
    const videoId = extractVideoId(rawInput);
    if (!videoId) return;

    const resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";
    
    document.getElementById("videoTitle").textContent = "Загрузка метаданных...";
    document.getElementById("videoAuthor").textContent = "Автор: поиск...";
    document.getElementById("directDownloadLink").style.display = "none";
    document.getElementById("proxyDownloadBtn").style.display = "none";
    
    const playerLink = document.getElementById("playerLink");
    playerLink.href = `https://bastyon.com/index?video=1&v=${videoId}`;

    try {
        const response = await fetch('https://1.pocketnet.app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                jsonrpc: '2.0',
                id: 1,
                method: 'getpost',
                params: [videoId]
            })
        });

        if (response.ok) {
            const data = await response.json();
            const post = data.result;

            if (post) {
                currentVideoTitle = post.caption || post.title || "bastyon-video";
                const author = post.address || "Неизвестный автор";
                let thumb = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";
                
                if (post.settings && post.settings.v && post.settings.v.image) {
                    thumb = post.settings.v.image;
                } else if (post.image) {
                    thumb = post.image;
                }

                // Ищем прямую ссылку на видеофайл
                if (post.settings && post.settings.v && post.settings.v.url) {
                    currentVideoUrl = post.settings.v.url;
                } else if (post.url) {
                    currentVideoUrl = post.url;
                }

                // Если в метаданных нет прямой ссылки, конструируем стандартную PeerTube-ссылку на скачивание по ID
                if (!currentVideoUrl) {
                    // Резервный поиск или генерация прямой ссылки
                    currentVideoUrl = `https://peertube372.pocketnet.app/download/videos/${videoId}.mp4`;
                }

                // Настраиваем имя файла
                const safeName = currentVideoTitle.replace(/[^a-zA-Zа-яА-Я0-9-_]/g, '_').substring(0, 40) + '.mp4';

                // Активируем кнопку прямой загрузки
                const directLink = document.getElementById("directDownloadLink");
                directLink.href = currentVideoUrl;
                directLink.setAttribute("download", safeName);
                directLink.style.display = "block";

                // Активируем кнопку через прокси
                document.getElementById("proxyDownloadBtn").style.display = "block";

                document.getElementById("videoTitle").textContent = currentVideoTitle;
                document.getElementById("videoAuthor").textContent = "Автор: " + author;
                document.getElementById("videoThumb").src = thumb;
                return;
            }
        }
        throw new Error("Пост не найден");
    } catch (err) {
        console.warn("Ошибка запроса метаданных, используем дефолтную ссылку:", err);
        // Ручной фоллбэк для конкретного ID из вашего примера
        currentVideoUrl = `https://peertube372.pocketnet.app/download/videos/4a1d7e9561a94b8b3f65abb42deccd9747b74288ae874f7bde0156b4725a148f.mp4`;
        
        const directLink = document.getElementById("directDownloadLink");
        directLink.href = currentVideoUrl;
        directLink.setAttribute("download", "bastyon_video.mp4");
        directLink.style.display = "block";
        document.getElementById("proxyDownloadBtn").style.display = "block";

        document.getElementById("videoTitle").textContent = "Видео Bastyon (ID)";
        document.getElementById("videoAuthor").textContent = "Автор: Децентрализованная сеть";
    }
}

// Метод 2: Принудительное скачивание через публичный CORS-прокси (если первый метод открывает видео в окне вместо скачивания)
async function downloadViaProxy() {
    if (!currentVideoUrl) return;
    
    const btn = document.getElementById("proxyDownloadBtn");
    btn.textContent = "⏳ Скачивание через шлюз...";
    btn.disabled = true;

    try {
        // Используем публичный прокси для обхода CORS ограничений ноды PeerTube
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(currentVideoUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Шлюз недоступен");
        
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = "bastyon_video_downloaded.mp4";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        btn.textContent = "✅ Успешно скачано!";
    } catch (e) {
        console.warn("Прокси не справился с потоком, открываем в новой вкладке:", e);
        window.open(currentVideoUrl, '_blank');
        btn.textContent = "💾 Скачать через CORS-шлюз";
    } finally {
        btn.disabled = false;
    }
}

window.onload = initBastyon;
</script>

</body>
</html>
