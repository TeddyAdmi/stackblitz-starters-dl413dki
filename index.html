<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Video Downloader</title>
    
    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app { width: 100%; max-width: 480px; padding: 20px; }
        .title { text-align: center; font-size: 26px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 25px; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
        }
        input[type="text"]:focus { outline: none; border-color: #f97316; }
        .btn {
            border: 0;
            border-radius: 14px;
            padding: 0 20px;
            background: #f97316;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn:hover { background: #ea580c; }
        .result { margin-top: 20px; padding: 18px; border-radius: 18px; background: #1f2937; }
        .video-info { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
        .video-thumb { width: 110px; height: 62px; object-fit: cover; border-radius: 8px; background: #374151; }
        .video-details h3 {
            font-size: 14px; margin: 0 0 6px 0;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .video-details p { font-size: 12px; color: #9ca3af; margin: 0; }
        .download-btn {
            background: #3b82f6; color: white; text-decoration: none;
            padding: 10px 14px; border-radius: 10px; font-size: 14px;
            font-weight: 500; text-align: center; display: block;
        }
        .download-btn:hover { opacity: 0.9; }
        .status { margin-top: 20px; text-align: center; color: #6ee7b7; font-size: 13px; }
    </style>
</head>
<body>

<div class="app">
    <div class="title">Bastyon DL</div>
    <div class="subtitle">Скачивание видео из сети</div>

    <div class="input-group">
        <input type="text" id="urlInput" value="7f82bd3abe4702637528e7c8ecc9a10c8f4d6f863aec6a063026714072361750" placeholder="ID или ссылка на видео...">
        <button class="btn" onclick="fetchVideo()">Найти</button>
    </div>

    <div id="resultCard" class="result">
        <div class="video-info">
            <img id="videoThumb" class="video-thumb" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80" alt="Thumbnail">
            <div class="video-details">
                <h3 id="videoTitle">Введите ID видео</h3>
                <p id="videoAuthor">Автор: —</p>
            </div>
        </div>
        <div id="linksList">
            <a id="actionLink" href="#" target="_blank" class="download-btn">📥 Открыть плеер</a>
        </div>
    </div>

    <div id="status" class="status">Инициализация SDK...</div>
</div>

<script>
let sdk = null;

async function initBastyon() {
    try {
        if (typeof BastyonSdk !== 'undefined') {
            sdk = new BastyonSdk();
            await sdk.init();
            sdk.emit("loaded");
            document.getElementById("status").textContent = "Bastyon подключён";
        }
    } catch (e) {
        document.getElementById("status").textContent = "Автономный режим";
    }
}

async function fetchVideo() {
    const rawInput = document.getElementById("urlInput").value.trim();
    if (!rawInput) return;

    // Извлекаем ID видео из ссылки или берем строку целиком, если это хэш
    let videoId = rawInput;
    try {
        if (rawInput.includes('http')) {
            const urlObj = new URL(rawInput);
            videoId = urlObj.searchParams.get("v") || urlObj.searchParams.get("id") || urlObj.pathname.split("/").pop();
        }
    } catch (e) {}

    document.getElementById("videoTitle").textContent = "Загрузка данных с ноды...";
    document.getElementById("videoAuthor").textContent = "Автор: поиск...";

    const actionLink = document.getElementById("actionLink");
    actionLink.href = `https://bastyon.com/index?video=1&v=${videoId}`;

    try {
        // Запрос к RPC-ноде Pocketnet для получения информации о посте/видео
        const response = window.fetch ? await fetch('https://1.pocketnet.app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                jsonrpc: '2.0',
                id: 1,
                method: 'getpost',
                params: [videoId]
            })
        }) : null;

        if (response && response.ok) {
            const data = await response.json();
            const post = data.result;

            if (post) {
                // Извлекаем название, автора и превью
                const title = post.caption || post.title || "Видео без названия";
                const author = post.address || "Неизвестный автор";
                let thumb = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";
                
                if (post.settings && post.settings.v && post.settings.v.image) {
                    thumb = post.settings.v.image;
                } else if (post.image) {
                    thumb = post.image;
                }

                document.getElementById("videoTitle").textContent = title;
                document.getElementById("videoAuthor").textContent = "Автор: " + author;
                document.getElementById("videoThumb").src = thumb;
                return;
            }
        }
        throw new Error("Пустой ответ ноды");
    } catch (err) {
        console.warn("Ошибка запроса метаданных:", err);
        document.getElementById("videoTitle").textContent = "Видео ID: " + videoId.substring(0, 12) + "...";
        document.getElementById("videoAuthor").textContent = "Автор: Сеть Bastyon";
    }
}

window.onload = () => {
    initBastyon();
    fetchVideo();
};
</script>

</body>
</html>
